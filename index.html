<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bollino</title>
<meta name="description" content="Bollino, a habit tracker for iPhone.">
<style>
:root{--ground:#E8F7F5;--ink:#102D35;--soft:#3E5F66;--card:#102D35;--accent:#D9FA57;--rule:#BFE3DE}
@media (prefers-color-scheme:dark){:root{--ground:#0A1E24;--ink:#E8F7F5;--soft:#9DBDC0;--card:#143841;--rule:#225560}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:40px 16px 64px}
header{background:var(--card);color:#E8F7F5;border-radius:18px;padding:20px 22px;margin-bottom:28px}
header .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.02em}
header .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none}
h1{font-size:28px;line-height:1.2;margin:10px 0 0}
.updated{color:#9DBDC0;font-size:15px;margin:6px 0 0}
h2{font-size:19px;margin:28px 0 6px}
p{margin:0 0 12px}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
ul{padding-left:20px}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);color:var(--soft);font-size:15px}
footer a{margin-right:16px}
</style>
</head>
<body>
<main>
<header>
<div class="brand"><span class="dot"></span>Bollino</div>
<h1>Bollino</h1>
<p class="updated">A habit tracker for iPhone</p>
</header>
<p>Mark habits done in a tap, from widgets, Control Center or Siri. No account, no ads, no tracking.</p>
<ul>
<li><a href="/privacy/">Privacy policy</a></li>
<li><a href="/support/">Support</a></li>
</ul>
<footer><a href="/">Bollino</a><a href="/privacy/">Privacy policy</a><a href="/support/">Support</a></footer>
</main>
</body>
</html>
